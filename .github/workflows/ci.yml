name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "handoff/**"]
  # No paths-ignore on pull requests: "test" is a required check, so it must report on every PR.
  # A docs-only PR skips the Godot steps below and passes in seconds.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Docs-only change?
        id: scope
        run: |
          code=run
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
            echo "$changed"
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '(\.md$|^docs/|^handoff/)'; then
              code=skip
              echo "Only docs changed: skipping Godot."
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Cache Godot
        if: steps.scope.outputs.code == 'run'
        id: cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Download Godot
        if: steps.scope.outputs.code == 'run' && steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL --retry 4 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
      - name: Import
        if: steps.scope.outputs.code == 'run'
        run: ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --import
      - name: Tests
        if: steps.scope.outputs.code == 'run'
        run: ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 --headless --script res://tests/run_tests.gd
